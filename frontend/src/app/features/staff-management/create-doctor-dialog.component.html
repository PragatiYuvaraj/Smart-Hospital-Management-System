<div class="modal-dialog-header">
  <div class="dialog-icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
      <circle cx="8.5" cy="7" r="4"/>
      <line x1="20" y1="8" x2="20" y2="14"/>
      <line x1="23" y1="11" x2="17" y2="11"/>
    </svg>
  </div>
  <div>
    <h3 class="dialog-title">Create Doctor Account</h3>
    <p class="dialog-subtitle">Provision physician account and configure clinical permissions</p>
  </div>
</div>

<form [formGroup]="form" class="modal-form" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="docName">Full Name</label>
    <input type="text" id="docName" formControlName="name" placeholder="e.g. Dr. Jane Smith" />
  </div>

  <div class="form-group">
    <label for="docEmail">Email Address</label>
    <input type="email" id="docEmail" formControlName="email" placeholder="e.g. j.smith@smarthospital.local" />
  </div>

  <div class="form-group">
    <label for="docPassword">Temporary Password</label>
    <input type="password" id="docPassword" formControlName="password" placeholder="Create secure initial password" />
  </div>

  <div class="permissions-card">
    <span class="permissions-card-title">Assign Optional Permissions</span>
    <div class="permission-option">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="DUTY_DOCTOR" />
        <div class="option-meta">
          <span class="option-name">Duty Doctor</span>
          <span class="option-desc">Enables hospital-wide patient cross-coverage</span>
        </div>
      </label>
    </div>
    <div class="permission-option">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="VAULT_ACCESS" />
        <div class="option-meta">
          <span class="option-name">Document Vault</span>
          <span class="option-desc">Permits private physician document storage</span>
        </div>
      </label>
    </div>
  </div>

  <div class="modal-dialog-actions">
    <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isSaving">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="isSaving || form.invalid">
      <span *ngIf="isSaving">Creating Account...</span>
      <span *ngIf="!isSaving">Create Doctor</span>
    </button>
  </div>
</form>
