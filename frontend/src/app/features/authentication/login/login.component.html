<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Log in to access your hospital account</p>
    </div>

    <!-- Error Banner -->
    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="e.g. doctor@smarthospital.local"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="isLoading">
        <span *ngIf="isLoading">Authenticating...</span>
        <span *ngIf="!isLoading">Sign In</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Are you a patient? <a routerLink="/register">Register here</a></p>
    </div>

    <!-- Demo Account Quick Fill helper -->
    <div class="demo-box">
      <span class="demo-title">Demo Account Quick Fill:</span>
      <div class="demo-buttons">
        <button type="button" class="btn-demo" (click)="fillDemo('DOCTOR')">Doctor</button>
        <button type="button" class="btn-demo" (click)="fillDemo('PHARMACY')">Pharmacy</button>
        <button type="button" class="btn-demo" (click)="fillDemo('PATIENT')">Patient</button>
      </div>
    </div>
  </div>
</div>
