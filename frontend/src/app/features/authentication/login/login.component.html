<div class="auth-wrapper">
  <div class="auth-card-container">
    <div class="card auth-card">

      <!-- Header with Clinical Icon -->
      <div class="auth-header">
        <div class="auth-logo-badge">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <h2>Sign In to Portal</h2>
        <p>Smart Hospital Clinical & Patient Management</p>
      </div>

      <!-- Error Banner -->
      <div *ngIf="errorMessage" class="error-banner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              placeholder="e.g. doctor@smarthospital.local"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-auth" [disabled]="isLoading">
          <span *ngIf="isLoading">Authenticating Session...</span>
          <span *ngIf="!isLoading">Sign In</span>
        </button>
      </form>

      <!-- Patient Registration Link -->
      <div class="auth-footer">
        <span>Are you a new patient?</span>
        <a routerLink="/register">Register here</a>
      </div>

      <!-- Demo Accounts Helper -->
      <div class="demo-box">
        <span class="demo-title">Demo Account Email</span>
        <p>Select a role to fill the email address, then enter its password above.</p>
        <div class="demo-buttons">
          <button type="button" class="btn-demo-pill doctor" (click)="fillDemo('DOCTOR')">
            <span class="role-dot"></span> Doctor
          </button>
          <button type="button" class="btn-demo-pill pharmacy" (click)="fillDemo('PHARMACY')">
            <span class="role-dot"></span> Pharmacy
          </button>
          <button type="button" class="btn-demo-pill patient" (click)="fillDemo('PATIENT')">
            <span class="role-dot"></span> Patient
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
