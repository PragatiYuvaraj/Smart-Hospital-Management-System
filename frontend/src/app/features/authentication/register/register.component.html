<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="auth-header">
      <h2>Patient Registration</h2>
      <p>Create your personal patient portal account</p>
    </div>

    <!-- Error Banner -->
    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <!-- Registration Form -->
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="name"
          placeholder="e.g. John Doe"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="e.g. john.doe@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password (Minimum 6 characters)</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Create a secure password"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Re-enter password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="isLoading">
        <span *ngIf="isLoading">Creating Account...</span>
        <span *ngIf="!isLoading">Register as Patient</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
      <p style="font-size: 0.8rem; color: #9ca3af; margin-top: 12px;">
        Note: Doctor and Pharmacy accounts are provisioned by hospital administration.
      </p>
    </div>
  </div>
</div>
